<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小区车辆查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{--scale:1}
body{background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);transition:background .3s}

/* Header toggles */
.header-toggles{position:absolute;right:16px;top:max(60px, env(safe-area-inset-top, 20px));z-index:20;display:flex;gap:8px}
.header-toggles button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(4px)}
.header-toggles button:active{transform:scale(.9);background:rgba(255,255,255,.3)}

.header{background:linear-gradient(180deg,#1a73e8,#1565c0);padding:60px 16px 32px;text-align:center;color:#fff;position:relative;transition:background .3s}
.header h1{font-size:calc(28px * var(--scale));font-weight:700;letter-spacing:2px}
.header p{font-size:calc(15px * var(--scale));opacity:.9;margin-top:calc(6px * var(--scale))}

/* Search */
.search-box{max-width:640px;margin:-24px auto 0;padding:0 14px;position:relative;z-index:10}
.search-wrap{position:relative}
#searchInput{width:100%;height:calc(68px * var(--scale));border:none;border-radius:calc(16px * var(--scale));outline:none;padding:0 calc(56px * var(--scale)) 0 calc(24px * var(--scale));font-size:calc(22px * var(--scale));background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.1);-webkit-appearance:none;color:#111;transition:background .3s,color .3s}
#searchInput::placeholder{color:#bbb;font-size:calc(18px * var(--scale))}
#clearBtn{position:absolute;right:calc(12px * var(--scale));top:50%;transform:translateY(-50%);width:calc(36px * var(--scale));height:calc(36px * var(--scale));border-radius:50%;background:#ddd;color:#666;font-size:calc(18px * var(--scale));border:none;cursor:pointer;display:none;align-items:center;justify-content:center;transition:.1s;line-height:1}
#clearBtn:active{background:#bbb}
.content{max-width:640px;margin:0 auto;padding:calc(10px * var(--scale)) 14px calc(40px * var(--scale))}

/* Zone buttons */
.zone-row{display:flex;gap:calc(10px * var(--scale));margin:calc(16px * var(--scale)) 0}
.zone-btn{flex:1;text-align:center;padding:calc(18px * var(--scale)) calc(8px * var(--scale));border:none;border-radius:calc(16px * var(--scale));font-size:calc(20px * var(--scale));font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.08);letter-spacing:calc(2px * var(--scale))}
.zone-btn:active{transform:scale(.96)}
.ground-btn{background:#e8f5e9;color:#2e7d32}
.perim-btn{background:#fff3e0;color:#e65100}

/* Recent tags */
.quick{display:flex;gap:calc(8px * var(--scale));flex-wrap:wrap;margin-bottom:calc(10px * var(--scale))}
.quick span{background:#fff;border:1px solid #ddd;padding:calc(10px * var(--scale)) calc(20px * var(--scale));border-radius:calc(20px * var(--scale));font-size:calc(17px * var(--scale));cursor:pointer;color:#333;transition:.1s;font-weight:500}
.quick span:active{background:#1a73e8;color:#fff;border-color:#1a73e8}

/* Results */
.hit-count{font-size:calc(15px * var(--scale));color:#888;margin:calc(10px * var(--scale)) 0 calc(8px * var(--scale))}

/* Card animation */
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:calc(18px * var(--scale));padding:calc(20px * var(--scale)) calc(16px * var(--scale));margin-bottom:calc(10px * var(--scale));box-shadow:0 2px 12px rgba(0,0,0,.07);display:flex;align-items:center;gap:calc(12px * var(--scale));animation:cardIn .35s ease-out both;transition:background .3s,box-shadow .3s}
.card:active{transform:scale(.99)}
.card-left{flex:1;min-width:0}
.plate{font-size:calc(26px * var(--scale));font-weight:700;color:#111;letter-spacing:calc(1px * var(--scale));transition:color .3s}
.seq-info{font-size:calc(16px * var(--scale));color:#888;margin-top:calc(4px * var(--scale));font-weight:500;transition:color .3s}
.room{font-size:calc(18px * var(--scale));color:#555;margin-top:calc(6px * var(--scale));transition:color .3s}
.phone-row{display:flex;align-items:center;gap:calc(12px * var(--scale));margin-top:calc(8px * var(--scale))}
.phone-num{font-size:calc(26px * var(--scale));color:#d32f2f;font-weight:800;letter-spacing:calc(1px * var(--scale));cursor:pointer;transition:color .3s;-webkit-user-select:none;user-select:none}
.phone-num:active{opacity:.7}
.zone-tag{font-size:calc(13px * var(--scale));padding:calc(3px * var(--scale)) calc(10px * var(--scale));border-radius:calc(5px * var(--scale));font-weight:700;white-space:nowrap}
.card-right{display:flex;flex-direction:column;gap:calc(8px * var(--scale));flex-shrink:0}

.action-btn{border:none;width:calc(56px * var(--scale));height:calc(56px * var(--scale));border-radius:calc(14px * var(--scale));font-size:calc(26px * var(--scale));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.action-btn:active{transform:scale(.85)}
.call-btn{background:#e8f5e9;color:#2e7d32}
.copy-btn{background:#e3f2fd;color:#1565c0}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:calc(16px * var(--scale)) calc(32px * var(--scale));border-radius:calc(14px * var(--scale));font-size:calc(18px * var(--scale));z-index:999;transition:opacity .3s;display:none;text-align:center;white-space:nowrap}

.empty-state{padding:calc(50px * var(--scale)) 20px;text-align:center;color:#999;font-size:calc(18px * var(--scale));transition:color .3s}
.empty-state .eicon{font-size:calc(64px * var(--scale));opacity:.25;margin-bottom:calc(12px * var(--scale))}
.empty-state .hint{font-size:calc(15px * var(--scale));color:#bbb;margin-top:calc(6px * var(--scale));transition:color .3s}

/* ── Dark Mode ── */
body.dark-mode{background:#12121c}
body.dark-mode .header{background:linear-gradient(180deg,#1a1a2e,#16213e)}
body.dark-mode #searchInput{background:#1e1e32;color:#ddd;box-shadow:0 4px 16px rgba(0,0,0,.3)}
body.dark-mode #searchInput::placeholder{color:#666}
body.dark-mode #clearBtn{background:#333;color:#999}
body.dark-mode #clearBtn:active{background:#444}
body.dark-mode .card{background:#1e1e32;box-shadow:0 2px 12px rgba(0,0,0,.25)}
body.dark-mode .plate{color:#eee}
body.dark-mode .seq-info{color:#888}
body.dark-mode .room{color:#999}
body.dark-mode .phone-num{color:#ff5252}
body.dark-mode .quick span{background:#1e1e32;border-color:#333;color:#bbb}
body.dark-mode .quick span:active{background:#1a73e8;color:#fff;border-color:#1a73e8}
body.dark-mode .hit-count{color:#666}
body.dark-mode .empty-state{color:#555}
body.dark-mode .empty-state .hint{color:#444}
body.dark-mode .zone-btn{box-shadow:0 3px 10px rgba(0,0,0,.2)}
body.dark-mode .action-btn{box-shadow:0 3px 8px rgba(0,0,0,.2)}

/* Safe area for iPhone notch */
@supports(padding:max(0px)) {
  .header{padding-top:max(60px, env(safe-area-inset-top, 20px))}
  .content{padding-bottom:max(40px, env(safe-area-inset-bottom, 20px))}
}
</style>

// Build plate index: plate -> all records (for showing ground/perimeter numbers)
var PLATE_INDEX = {};
DATA.forEach(function(d){
    if(!PLATE_INDEX[d.p]) PLATE_INDEX[d.p] = [];
    PLATE_INDEX[d.p].push(d);
});

function getSeqDisplay(plate){
    var records = PLATE_INDEX[plate];
    if(!records) return '';
    var parts = [];
    records.forEach(function(r){
        parts.push(r.z + '-编号' + r.s);
    });
    return parts.join(', ');
}

// Keyword highlighting (case-insensitive)
function highlightText(text, keyword){
    if(!keyword || !text) return text;
    var lower = text.toLowerCase();
    var kwLower = keyword.toLowerCase();
    var idx = lower.indexOf(kwLower);
    if(idx === -1) return text;
    var matchStr = text.slice(idx, idx + keyword.length);
    return text.slice(0, idx) + '<span style="background:#ffeb3b;color:#000;font-weight:700;padding:0 2px;border-radius:2px">' + matchStr + '</span>' + text.slice(idx + keyword.length);
}

// Recent searches (max 5)
var recentSearches = JSON.parse(localStorage.getItem('vehicleRecent') || '[]');
function addRecent(q){
    q = q.trim();
    if(!q || q.length < 2) return;
    recentSearches = recentSearches.filter(function(s){ return s !== q; });
    recentSearches.unshift(q);
    if(recentSearches.length > 5) recentSearches.pop();
    localStorage.setItem('vehicleRecent', JSON.stringify(recentSearches));
    renderRecent();
}
function renderRecent(){
    var el = document.getElementById('recentTags');
    if(!el) return;
    if(recentSearches.length === 0){ el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = '';
    recentSearches.forEach(function(s){
        var span = document.createElement('span');
        span.textContent = s;
        span.onclick = function(){ document.getElementById('searchInput').value = s; doSearch(s); };
        el.appendChild(span);
    });
}

var input = document.getElementById('searchInput');
var ra = document.getElementById('resultArea');
var clearBtn = document.getElementById('clearBtn');

// Search clear button
function updateClearBtn(){
    clearBtn.style.display = input.value ? 'flex' : 'none';
}
function clearSearch(){
    input.value = '';
    doSearch('');
    input.focus();
    updateClearBtn();
}

function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){ showToast('已复制号码'); return; }).catch(function(){});
    }
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制号码');
}

function showToast(m){
    var t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block'; t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.opacity = '0'; }, 1800);
}

// Phone number: tap to call, long press to copy
var _lpTimer = null;
var _wasLP = false;
function phoneTap(ph, e){
    if(_wasLP){ _wasLP = false; return; }
    if(ph && ph !== '无') window.open('tel:'+ph);
}
function phoneDown(ph, e){
    _wasLP = false;
    _lpTimer = setTimeout(function(){
        _wasLP = true;
        if(ph && ph !== '无') copyText(ph);
    }, 500);
}
function phoneUp(){
    clearTimeout(_lpTimer);
}
function phoneLeave(){
    clearTimeout(_lpTimer);
}

var cardIdx = 0;

function showZone(z){
    input.value = '';
    renderRecent();
    updateClearBtn();
    var items = DATA.filter(function(d){ return d.z === z; });
    cardIdx = 0;
    renderResults(items, z === '地面' ? '地面车辆' : '外围车辆');
}

function renderCard(d, kw){
    var bgColor = d.z === '地面' ? '#e8f5e9' : '#fff3e0';
    var tagColor = d.z === '地面' ? '#2e7d32' : '#e65100';
    var phNum = d.ph ? d.ph : '';
    var seqDisplay = getSeqDisplay(d.p);
    var plateD = kw ? highlightText(d.p, kw) : d.p;
    var roomD = kw ? highlightText(d.r, kw) : d.r;
    var phoneD = kw ? highlightText(d.ph, kw) : (d.ph || '<span style="color:#ccc">无</span>');

    var delay = (cardIdx++) * 0.04;
    var s = '<div class="card" style="border-left:6px solid '+tagColor+';animation-delay:'+delay+'s">';
    s += '<div class="card-left">';
    s += '<div class="plate">' + plateD + '</div>';
    s += '<div class="seq-info">' + seqDisplay + '</div>';
    s += '<div class="room">' + roomD + '</div>';
    s += '<div class="phone-row">';
    if(phNum){
        s += '<span class="phone-num" onclick="phoneTap(\''+phNum+'\',event)" ontouchstart="phoneDown(\''+phNum+'\',event)" ontouchend="phoneUp()" ontouchmove="phoneLeave()" onmousedown="phoneDown(\''+phNum+'\',event)" onmouseup="phoneUp()" onmouseleave="phoneLeave()">' + phoneD + '</span>';
    } else {
        s += '<span class="phone-num" style="color:#ccc;cursor:default">无</span>';
    }
    s += '<span class="zone-tag" style="background:'+bgColor+';color:'+tagColor+'">'+d.z+'</span>';
    s += '</div></div>';
    s += '<div class="card-right">';
    if(phNum){
        s += '<button class="action-btn call-btn" onclick="window.open(\'tel:'+phNum+'\')">📞</button>';
        s += '<button class="action-btn copy-btn" onclick="copyText(\''+phNum+'\')">📋</button>';
    }
    s += '</div></div>';
    return s;
}

function renderResults(items, title){
    var html = '<div class="hit-count">' + (title||'') + (title?' - ':'') + items.length + ' 条</div>';
    var show = items.slice(0, 200);
    show.forEach(function(d){
        html += renderCard(d, '');
    });
    if(items.length > 200) html += '<div style="text-align:center;font-size:14px;color:#999;padding:14px">仅显示前200条</div>';
    ra.innerHTML = html;
}

function doSearch(v){
    v = v.trim();
    renderRecent();
    updateClearBtn();
    if(!v){
        ra.innerHTML = '<div class="empty-state"><div class="eicon">🔍</div>输入车牌、房号或手机号<br><span class="hint">点上方按钮可查看全部车辆</span></div>';
        return;
    }
    addRecent(v);

    var vL = v.toLowerCase();
    var r = DATA.filter(function(d){
        return d.p.toLowerCase().indexOf(vL) > -1 || d.r.indexOf(v) > -1 || d.ph.indexOf(v) > -1;
    });

    if(r.length === 0){
        ra.innerHTML = '<div class="empty-state"><div class="eicon">😕</div>没有找到<br><span class="hint">试试其他关键字</span></div>';
        return;
    }

    cardIdx = 0;
    var html = '<div class="hit-count">找到 ' + r.length + ' 条</div>';
    var show = r.slice(0, 150);
    show.forEach(function(d){
        html += renderCard(d, v);
    });
    if(r.length > 150) html += '<div style="text-align:center;font-size:14px;color:#999;padding:14px">仅显示前150条</div>';
    ra.innerHTML = html;
}

// Font size toggle
function toggleFont(){
    var root = document.documentElement;
    var btn = document.getElementById('fontBtn');
    if(root.style.getPropertyValue('--scale') === '1.3'){
        root.style.setProperty('--scale', '1');
        btn.textContent = '大';
        btn.style.borderColor = 'rgba(255,255,255,.6)';
        localStorage.setItem('vehicleFontLarge', '0');
    } else {
        root.style.setProperty('--scale', '1.3');
        btn.textContent = '原';
        btn.style.borderColor = '#ffeb3b';
        localStorage.setItem('vehicleFontLarge', '1');
    }
}
// Restore font preference
if(localStorage.getItem('vehicleFontLarge') === '1'){
    document.documentElement.style.setProperty('--scale', '1.3');
    document.getElementById('fontBtn').textContent = '原';
    document.getElementById('fontBtn').style.borderColor = '#ffeb3b';
}

// Dark mode toggle
function toggleDark(){
    var body = document.body;
    var btn = document.getElementById('darkBtn');
    body.classList.toggle('dark-mode');
    var isDark = body.classList.contains('dark-mode');
    btn.textContent = isDark ? '☀️' : '🌙';
    btn.style.borderColor = isDark ? '#ffeb3b' : 'rgba(255,255,255,.6)';
    localStorage.setItem('vehicleDarkMode', isDark ? '1' : '0');
}
// Restore dark mode preference
if(localStorage.getItem('vehicleDarkMode') === '1'){
    document.body.classList.add('dark-mode');
    document.getElementById('darkBtn').textContent = '☀️';
    document.getElementById('darkBtn').style.borderColor = '#ffeb3b';
}
