name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate APK from PWA
        run: |
          npm install -g @pwabuilder/cli
          mkdir -p build-tmp
          cd build-tmp
          npx @pwabuilder/cli init \
            --manifest https://haol98750-stack.github.io/vehicle-query/manifest.json \
            --output .
          npx @pwabuilder/cli build \
            --platform android \
            --output ./apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-query-apk
          path: build-tmp/**/*.apk
          if-no-files-found: warn
