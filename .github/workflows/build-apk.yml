name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f "gradlew" ]; then
            apt-get update -qq && apt-get install -y -qq wget unzip 2>/dev/null || true
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.5/bin/gradle wrapper
          fi
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 车辆查询.apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
